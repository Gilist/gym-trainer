<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EBEDF1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מאמן הברזל">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>מאמן הברזל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@600;800&display=swap">
<style>
:root{
  --ground:#EBEDF1; --surface:#FFFFFF; --surface-2:#F4F5F8;
  --ink:#14181D; --muted:#5E6875; --line:#D8DDE4;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#E4EAFB;
  --hot:#C81F38; --hot-soft:#FBE6E9;
  --good:#0E8F5F; --good-soft:#E1F4EC;
  --warn:#9A6300; --warn-soft:#FBF0DC;
  --shadow:0 1px 2px rgba(20,24,29,.06), 0 8px 24px -12px rgba(20,24,29,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1015; --surface:#161B22; --surface-2:#1D232C;
    --ink:#E7EBF1; --muted:#94A0AF; --line:#28303A;
    --accent:#6D8FFF; --accent-ink:#0D1015; --accent-soft:#1B2440;
    --hot:#FF6B7C; --hot-soft:#331B21;
    --good:#3AD79E; --good-soft:#13302A;
    --warn:#E0A93B; --warn-soft:#33280F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1015; --surface:#161B22; --surface-2:#1D232C;
  --ink:#E7EBF1; --muted:#94A0AF; --line:#28303A;
  --accent:#6D8FFF; --accent-ink:#0D1015; --accent-soft:#1B2440;
  --hot:#FF6B7C; --hot-soft:#331B21;
  --good:#3AD79E; --good-soft:#13302A;
  --warn:#E0A93B; --warn-soft:#33280F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{direction:rtl; margin:0; background:var(--ground); color:var(--ink);
  font-family:"Heebo",system-ui,"Segoe UI",sans-serif; font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Rubik","Heebo",system-ui,sans-serif; margin:0; text-wrap:balance; letter-spacing:-.01em}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
input{font:inherit}
.num{font-variant-numeric:tabular-nums}
.app{max-width:600px; margin:0 auto; padding:0 16px 140px}

.top{position:sticky; top:0; z-index:30; background:var(--ground); padding:14px 0 10px;
  margin:0 -16px; padding-inline:16px}
.top-row{display:flex; align-items:center; gap:10px}
.brand{font-family:"Rubik"; font-weight:800; font-size:19px; letter-spacing:-.02em}
.brand span{color:var(--accent)}
.spacer{flex:1}
.iconbtn{width:38px; height:38px; border-radius:12px; display:grid; place-items:center;
  background:var(--surface); border:1px solid var(--line); font-size:15px}
.iconbtn:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.rail{margin-top:12px}
.rail-head{display:flex; align-items:baseline; gap:8px; font-size:13.5px; color:var(--muted); margin-bottom:6px}
.rail-head b{color:var(--ink); font-weight:700}
.bar{height:8px; border-radius:99px; background:var(--line); overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .35s cubic-bezier(.2,.8,.2,1)}

.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--shadow)}
.stack{display:flex; flex-direction:column; gap:12px}
.section-label{font-size:13px; font-weight:700; color:var(--muted); margin:22px 2px 10px}
.plan-note{font-size:13.5px; color:var(--muted); margin:16px 2px 12px; line-height:1.45}

.day{display:flex; align-items:center; gap:14px; width:100%; text-align:start}
.day-mark{width:46px; height:46px; flex:none; border-radius:14px; display:grid; place-items:center;
  background:var(--accent-soft); color:var(--accent); font-family:"Rubik"; font-weight:800; font-size:18px}
.day.rest .day-mark{background:var(--surface-2); color:var(--muted)}
.day.tool .day-mark{background:var(--surface-2); color:var(--accent); font-size:20px}
.day-title{font-family:"Rubik"; font-weight:600; font-size:17px}
.day-meta{font-size:13.5px; color:var(--muted)}
.chev{color:var(--muted); font-size:20px; margin-inline-start:auto}

.resume{border-color:var(--accent); background:linear-gradient(180deg,var(--accent-soft),var(--surface) 60%)}

.ex{transition:border-color .2s, opacity .2s}
.ex.current{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), var(--shadow)}
.ex.done{opacity:.62}
.ex-head{display:flex; gap:12px; align-items:flex-start}
.ex-idx{width:26px; height:26px; flex:none; border-radius:9px; background:var(--surface-2);
  display:grid; place-items:center; font-size:12.5px; font-weight:700; color:var(--muted); margin-top:2px}
.ex.done .ex-idx{background:var(--good-soft); color:var(--good)}
.ex-group{font-size:12.5px; font-weight:700; color:var(--accent)}
.ex.done .ex-group{color:var(--good)}
.ex-name{font-family:"Rubik"; font-weight:600; font-size:17px; line-height:1.3; margin-top:1px}
.ex-sub{font-size:13.5px; color:var(--muted); margin-top:3px}
.ex-en{font-size:13px; color:var(--muted); margin-top:4px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.ex-en .en{direction:ltr; unicode-bidi:isolate}
.ex-en a{color:var(--accent); text-decoration:none; font-weight:700; white-space:nowrap}
.howbtn{font-size:13px; color:var(--accent); font-weight:700; padding:0}
.how{margin-top:10px; padding:12px 14px; background:var(--surface-2); border-radius:14px; font-size:14px; line-height:1.55}
.ex-body{margin-top:14px; display:flex; flex-wrap:wrap; align-items:center; gap:10px}
.sets{display:flex; gap:8px; flex-wrap:wrap}
.set{width:46px; height:46px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface-2);
  font-family:"Rubik"; font-weight:600; font-size:15px; color:var(--muted); display:grid; place-items:center;
  transition:transform .12s, background .15s, color .15s, border-color .15s}
.set:active{transform:scale(.93)}
.set.on{background:var(--good); border-color:var(--good); color:#fff}
.set.next{border-color:var(--accent); color:var(--accent); background:var(--surface)}
.pill{border:1px solid var(--line); background:var(--surface-2); border-radius:99px; padding:7px 12px;
  font-size:13px; color:var(--muted); display:inline-flex; gap:6px; align-items:center}
.pill b{color:var(--ink); font-weight:700}

.tip{margin-top:12px; padding:11px 13px; border-radius:14px; font-size:13.5px; line-height:1.5; display:flex; gap:9px}
.tip .ic{flex:none; font-weight:800}
.tip.up{background:var(--good-soft); color:var(--good)}
.tip.stall{background:var(--warn-soft); color:var(--warn)}
.tip.keep{background:var(--surface-2); color:var(--muted)}
.tip b{font-weight:700}

.setlog{margin-top:12px; padding-top:10px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px}
.slog{display:flex; align-items:center; gap:8px; font-size:14px}
.slog .n{width:44px; color:var(--muted); font-size:13px; font-weight:700}
.slog input{width:58px; height:38px; text-align:center; border:1px solid var(--line); background:var(--surface-2);
  border-radius:11px; color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; padding:0}
.slog input:disabled{opacity:.4}
.slog .u{color:var(--muted); font-size:12.5px}
.slog.warm .n{color:var(--accent)}
.warmline{font-size:13px; color:var(--muted); margin-top:10px; background:var(--surface-2);
  padding:10px 12px; border-radius:12px}
.warmline b{color:var(--ink); font-weight:700}

.btn{border-radius:14px; padding:14px 18px; font-family:"Rubik"; font-weight:600; font-size:16px;
  background:var(--accent); color:var(--accent-ink); text-align:center; width:100%; transition:transform .12s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line)}
.btn.quiet{background:transparent; color:var(--muted); font-weight:500; font-size:14.5px; padding:10px}
.btn.danger{background:transparent; color:var(--hot); border:1px solid var(--line)}
.btn-row{display:flex; gap:10px}

.hist-top{display:flex; align-items:baseline; gap:8px}
.hist-date{font-family:"Rubik"; font-weight:600; font-size:16px}
.hist-when{font-size:13px; color:var(--muted); margin-inline-start:auto}
.hist-stats{display:flex; gap:16px; margin-top:10px; flex-wrap:wrap}
.stat{display:flex; flex-direction:column}
.stat b{font-family:"Rubik"; font-size:19px; font-weight:800}
.stat span{font-size:12px; color:var(--muted)}
.hist-lines{margin-top:12px; border-top:1px solid var(--line); padding-top:10px; display:flex; flex-direction:column; gap:6px; font-size:14px}
.hist-line{display:flex; gap:10px; color:var(--muted)}
.hist-line b{color:var(--ink); font-weight:500}
.hist-line em{font-style:normal; margin-inline-start:auto; font-variant-numeric:tabular-nums; white-space:nowrap; direction:ltr; unicode-bidi:isolate}

.sugg{border-color:var(--accent); background:linear-gradient(180deg,var(--accent-soft),var(--surface) 55%)}
.sugg p{margin:6px 0 0; font-size:14px; color:var(--muted)}
.alt{display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line)}
.alt-txt b{display:block; font-weight:500; font-size:14px}
.alt-txt span{font-size:12.5px; color:var(--muted)}
.alt button{border:1px solid var(--accent); color:var(--accent); border-radius:99px; padding:7px 14px;
  font-size:13.5px; font-weight:700; margin-inline-start:auto; white-space:nowrap}

.chart{width:100%; height:auto; display:block; margin-top:4px}
.ch-top{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.ch-name{font-family:"Rubik"; font-weight:600; font-size:16px}
.ch-en{font-size:12.5px; color:var(--muted); direction:ltr; unicode-bidi:isolate}
.ch-now{margin-inline-start:auto; font-family:"Rubik"; font-weight:800; font-size:18px; font-variant-numeric:tabular-nums}
.delta{font-size:13px; font-weight:700; padding:3px 9px; border-radius:99px; direction:ltr; unicode-bidi:isolate; display:inline-block}
.delta.up{background:var(--good-soft); color:var(--good)}
.delta.down{background:var(--hot-soft); color:var(--hot)}
.delta.flat{background:var(--surface-2); color:var(--muted)}
.ch-axis{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:2px; direction:ltr}

.field{display:flex; flex-direction:column; gap:6px; flex:1; min-width:120px}
.field label{font-size:13px; color:var(--muted); font-weight:700}
.field input{border:1px solid var(--line); background:var(--surface-2); border-radius:12px; padding:12px;
  color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; text-align:center}
.fields{display:flex; gap:10px; flex-wrap:wrap}
.log-row{display:flex; align-items:center; gap:10px; padding:11px 0; border-top:1px solid var(--line); font-size:14px}
.log-row .d{color:var(--muted); font-size:13px}
.log-row .v{margin-inline-start:auto; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}
.log-row .x{color:var(--muted); font-size:18px; padding:0 4px}
.sync-dot{width:9px; height:9px; border-radius:99px; display:inline-block; margin-inline-end:7px; vertical-align:middle}
.sync-dot.on{background:var(--good)} .sync-dot.off{background:var(--muted)} .sync-dot.err{background:var(--hot)}
.steps{counter-reset:st; margin:0; padding:0; list-style:none}
.steps li{counter-increment:st; position:relative; padding-inline-start:32px; margin-bottom:14px; font-size:14px; line-height:1.6}
.steps li::before{content:counter(st); position:absolute; inset-inline-start:0; top:1px; width:22px; height:22px;
  border-radius:8px; background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:12px;
  display:grid; place-items:center; font-family:"Rubik"}
.steps code, .kbd{background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:1px 6px;
  font-size:12.5px; direction:ltr; unicode-bidi:isolate; display:inline-block}
.sqlbox{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px;
  font-family:ui-monospace,Menlo,monospace; font-size:11.5px; line-height:1.6; direction:ltr; text-align:left;
  overflow-x:auto; white-space:pre; margin-top:8px}
.txtin{width:100%; border:1px solid var(--line); background:var(--surface-2); border-radius:12px; padding:12px;
  color:var(--ink); direction:ltr; text-align:left; font-size:14px}

/* מסך טרום-אימון */
.q{margin-top:14px}
.q h4{font-size:15px; font-weight:700; margin:0 0 4px; font-family:"Heebo"}
.q .sub{font-size:12.5px; color:var(--muted); margin-bottom:10px}
.opts{display:flex; gap:8px}
.opt{flex:1; border:1.5px solid var(--line); background:var(--surface-2); border-radius:14px; padding:12px 6px;
  font-size:13.5px; font-weight:600; text-align:center; line-height:1.3; transition:.15s}
.opt.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
.verdict{margin-top:18px; padding:16px; border-radius:16px; border:1px solid var(--line); background:var(--surface-2)}
.verdict.full{background:var(--good-soft); border-color:transparent}
.verdict.norm{background:var(--accent-soft); border-color:transparent}
.verdict.low{background:var(--warn-soft); border-color:transparent}
.verdict h3{font-size:17px}
.verdict ul{margin:10px 0 0; padding-inline-start:18px; font-size:14px; line-height:1.7}
.badge{display:inline-block; font-size:12px; font-weight:700; padding:4px 10px; border-radius:99px;
  background:var(--surface); color:var(--ink); margin-inline-start:8px}

.sheet{position:fixed; inset-inline:0; bottom:0; z-index:50; background:var(--surface); border-top:1px solid var(--line);
  border-radius:22px 22px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -14px 40px -20px rgba(0,0,0,.5); transform:translateY(110%); transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.up{transform:translateY(0)}
.sheet-in{max-width:600px; margin:0 auto; display:flex; align-items:center; gap:16px}
.ring{position:relative; width:88px; height:88px; flex:none}
.ring svg{transform:rotate(90deg) scaleX(-1)}
.ring-num{position:absolute; inset:0; display:grid; place-items:center; font-family:"Rubik"; font-weight:800;
  font-size:22px; font-variant-numeric:tabular-nums}
.sheet-t{font-family:"Rubik"; font-weight:600; font-size:16px}
.sheet-s{font-size:13.5px; color:var(--muted); margin-top:2px}
.sheet-btns{display:flex; gap:8px; margin-top:10px}
.sheet-btns button{border:1px solid var(--line); border-radius:99px; padding:9px 16px; font-size:14px; font-weight:600; white-space:nowrap}
.sheet-btns button.pri{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}

.footbar{position:fixed; inset-inline:0; bottom:0; z-index:40; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,var(--ground) 32%)}
.footbar-in{max-width:600px; margin:0 auto}
.empty{text-align:center; color:var(--muted); font-size:14.5px; padding:26px 10px; line-height:1.6}
.toast{position:fixed; inset-inline:0; bottom:96px; z-index:60; display:flex; justify-content:center; pointer-events:none; opacity:0; transition:opacity .25s}
.toast.show{opacity:1}
.toast div{background:var(--ink); color:var(--ground); padding:10px 16px; border-radius:99px; font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<div class="app" id="app"></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <div class="ring">
      <svg width="88" height="88" viewBox="0 0 88 88" aria-hidden="true">
        <circle cx="44" cy="44" r="38" fill="none" stroke="var(--line)" stroke-width="8"></circle>
        <circle id="ringArc" cx="44" cy="44" r="38" fill="none" stroke="var(--accent)" stroke-width="8"
                stroke-linecap="round" stroke-dasharray="238.76" stroke-dashoffset="0"></circle>
      </svg>
      <div class="ring-num" id="ringNum">1:00</div>
    </div>
    <div style="flex:1">
      <div class="sheet-t" id="sheetT">מנוחה</div>
      <div class="sheet-s" id="sheetS">הבא בתור…</div>
      <div class="sheet-btns">
        <button class="pri" data-act="skiprest">סיים מנוחה</button>
        <button data-act="addrest">‎+15 שנ׳</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><div id="toastMsg"></div></div>

<script>
"use strict";

/* ============ תוכנית האימונים ============
   pyr = תרגיל שמתאים לפירמידה (משקל עולה בין הסטים) */
const PLANS = [
  {
    id:"a", day:"יום א׳", title:"כוח ובסיס", kind:"strength",
    note:"טווח חזרות נמוך, משקל כבד. מנוחה ארוכה בתרגילים המורכבים.",
    exercises:[
      {group:"רגליים", name:"סקוואט חופשי (מוט)", sets:3, reps:"6-8 חזרות", rest:90, pyr:true,
       alts:["סקוואט קדמי (Front Squat)","האק סקוואט במכונה","סקוואט גובלט עם משקולת"]},
      {group:"חזה", name:"לחיצת חזה במוט (שטוח)", sets:3, reps:"6-8 חזרות", rest:90, pyr:true,
       alts:["לחיצת חזה משקולות (שטוח)","לחיצת חזה במכונת האמר","מקבילים עם משקל נוסף"]},
      {group:"גב", name:"מתח (או פולי רחב)", sets:3, reps:"מקסימום חזרות", rest:90, pyr:true,
       alts:["מתח באחיזה ניטרלית","חתירה במוט בהרכנה","פולי רחב באחיזה הפוכה"]},
      {group:"כתפיים", name:"לחיצת כתפיים במוט (עמידה)", sets:3, reps:"8-10 חזרות", rest:90, pyr:true,
       alts:["לחיצת ארנולד בישיבה","Push Press","לחיצת כתפיים במכונה"]},
      {group:"יד אחורית", name:"פשיטת מרפקים בכבל", sets:2, reps:"12-15 חזרות", rest:60,
       alts:["פשיטת מרפקים בכבל באחיזה הפוכה","מקבילים לטרייספס","לחיצה צרפתית בשכיבה"]},
      {group:"יד קדמית", name:"כפיפת מרפקים במוט W", sets:2, reps:"10-12 חזרות", rest:60,
       alts:["כפיפת מרפקים במוט ישר","כפיפה בכבל תחתון","כפיפת ריכוז (Concentration)"]},
      {group:"ליבה", name:"פשיטות גב", sets:3, reps:"15 חזרות", rest:60,
       alts:["Good Morning במשקל קל","גשר ירכיים (Hip Thrust)","Bird-Dog"]}
    ]
  },
  {id:"b", day:"יום ב׳", title:"מנוחה / אירובי", kind:"cardio", note:"30 דקות אירובי קל עד בינוני.",
   exercises:[{group:"אירובי", name:"אירובי מתון", sets:1, reps:"30 דקות", rest:0, alts:["הליכה בשיפוע","אופניים","שחייה"]}]},
  {
    id:"c", day:"יום ג׳", title:"נפח והיפרטרופיה", kind:"mass",
    note:"אימון מאסה — מנוחה של דקה וחצי בתרגילים המורכבים.",
    exercises:[
      {group:"רגליים", name:"לחיצת רגליים במכונה", sets:3, reps:"10-12 חזרות", rest:90, pyr:true,
       alts:["האק סקוואט","סקוואט גובלט","לחיצת רגל אחת במכונה"]},

function isTime(t){ return /שניות|דקות/.test(t); }

function targetReps(t){ const n = String(t).match(/\d+/g); return n ? +n[n.length-1] : null; }

/* ============ ניתוח היסטוריה (המאמן) ============ */
function topW(e){
  if(e.w && e.w.length){
    const n = e.w.map(parseFloat).filter(v => isFinite(v));
    if(n.length) return Math.max(...n);
  }
  const w = parseFloat(e.weight);
  return isFinite(w) ? w : null;
}
function exHistory(name){
  const out = [];
  history.forEach(s => {
    const e = s.exercises.find(x => x.name === name);
    if(e) out.push({date: s.date, top: topW(e), reps: (e.reps || []).map(Number).filter(v => isFinite(v)), sets: e.sets, done: e.done});
  });
  return out;                       // מהחדש לישן
}
function advice(ex, name){
  const h = exHistory(name);
  if(!h.length) return {type:"new", text:"אימון ראשון בתרגיל הזה — בחר משקל שמאפשר לסיים את כל הסטים בטכניקה נקייה, ורשום אותו."};
  const last = h[0];
  const target = targetReps(ex.reps);
  const step = stepOf(ex.group);
  const tops = h.slice(0,3).map(x => x.top).filter(v => v != null);

  if(last.top != null && target && last.reps.length >= last.done && last.reps.length && last.reps.every(r => r >= target)){
    return {type:"up", text:"סגרת את כל הסטים על " + target + " — עלה ל-<b>" + r25(last.top + step) + " ק״ג</b>."};
  }
  if(tops.length >= 3 && tops[0] === tops[1] && tops[1] === tops[2]){
    return {type:"stall", text:"3 אימונים על <b>" + tops[0] + " ק״ג</b>. שבוע דילוד ב-<b>" + r25(tops[0]*0.85) + " ק״ג</b> ואז חזרה — בדרך כלל שובר את התקיעה."};
  }
  if(last.top != null){
    return {type:"keep", text:"בפעם שעברה: <b>" + last.top + " ק״ג</b> × " + (last.reps.join("·") || last.done) + ". סגור את הטווח לפני שעולה במשקל."};
  }
  return {type:"keep", text:"בפעם שעברה: " + (last.reps.join("·") || last.done + " סטים") + ". הוסף חזרה לסט לפני שמוסיפים משקל."};
}
function coachBoard(){
  const out = [];
  PLANS.filter(p => p.kind !== "cardio").forEach(plan => {
    plan.exercises.forEach((ex,i) => {
      const name = exName(plan.id, i, ex);
      const h = exHistory(name);
      if(!h.length) return;
      const a = advice(ex, name);
      if(a.type === "up" || a.type === "stall") out.push({day: plan.day, name, a});
    });
  });
  return out.sort((x,y) => (x.a.type === "stall" ? -1 : 1) - (y.a.type === "stall" ? -1 : 1)).slice(0,4);
}
/* משקל מוצע לכל סט — פירמידה בתרגילים המורכבים */
function planWeights(ex, name, factor){
  const h = exHistory(name);
  const last = h[0];
  let top = last && last.top != null ? last.top : null;
  const target = targetReps(ex.reps);
  if(top != null && target && last.reps.length && last.reps.every(r => r >= target)) top = r25(top + stepOf(ex.group));
  if(top == null) return null;
  top = r25(top * (factor ? factor.w : 1));
  const n = ex.sets;
  if(!ex.pyr || n < 2) return new Array(n).fill(top);
  const ramp = n === 2 ? [0.94, 1] : [0.88, 0.94, 1, 1, 1];
  return Array.from({length:n}, (_,j) => r25(top * ramp[Math.min(j, ramp.length-1)]));
}
function warmups(ex, name, factor){
  if(!ex.pyr) return null;
  const w = planWeights(ex, name, factor);
  if(!w) return null;
  const top = w[w.length-1];
  return [{w: r25(top*0.5), r:5}, {w: r25(top*0.75), r:3}];
}

function startWorkout(planId, ready){
  const plan = planById(planId);
  const factor = ready ? ready.factor : {w:1, restAdd:0, drop:false};
  active = {
    planId, startedAt: Date.now(),
    ready: ready ? {key: ready.key, title: ready.title, score: ready.score} : null,
    factor,
    exercises: plan.exercises.map((ex,i) => {
      const name = exName(planId,i,ex);
      const drop = factor.drop && !ex.pyr && ex.sets >= 3;
      const sets = drop ? ex.sets - 1 : ex.sets;
      return {name, sets, done:new Array(sets).fill(false), reps:new Array(sets).fill(""), w:new Array(sets).fill("")};
    })
  };
  save(K.active, active);
  keepAwake(true);
  pending = null; view = "workout"; render(); window.scrollTo(0,0);
}
function totals(){
  let total = 0, done = 0, exDone = 0;
  active.exercises.forEach(st => {
    total += st.sets;
    const d = st.done.filter(Boolean).length;
    done += d;
    if(d === st.sets) exDone++;
  });
  return {total, done, exDone, exTotal: active.exercises.length};
}
function currentIndex(){
  for(let i=0;i<active.exercises.length;i++) if(active.exercises[i].done.some(v => !v)) return i;
  return active.exercises.length - 1;
}

let rest = {end:0, total:0, id:null};
const sheet = document.getElementById("sheet");
let audioCtx = null;
function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    [0,180,360].forEach((delay,k) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const t = audioCtx.currentTime + delay/1000;
      o.frequency.value = k === 2 ? 880 : 660; o.type = "sine";
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.18);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.2);
    });
  }catch(e){}

function startRest(sec, label){

  document.getElementById("sheetS").textContent = label;

let wakeLock = null;
async function keepAwake(on){
  try{
    if(!("wakeLock" in navigator)) return;
    if(on && !wakeLock){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    }else if(!on && wakeLock){ const w = wakeLock; wakeLock = null; await w.release(); }
  }catch(e){ wakeLock = null; }
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState !== "visible") return;
  if(active) keepAwake(true);
  if(rest.id) tickRest();

});

function toggleSet(i, j){
  keepAwake(true);
  const plan = planById(active.planId);
  const ex = plan.exercises[i];
  const st = active.exercises[i];
  const now = !st.done[j];
  st.done[j] = now;
  if(now){
    if(st.reps[j] === "" && targetReps(ex.reps)) st.reps[j] = targetReps(ex.reps);
    if(st.w[j] === ""){
      const pw = planWeights(ex, st.name, active.factor);
      const prevSet = j > 0 ? st.w[j-1] : "";
      // בתרגילי פירמידה המשקל המתוכנן לסט מנצח; אחרת ממשיכים עם משקל הסט הקודם
      st.w[j] = (ex.pyr && pw) ? pw[j] : (prevSet !== "" ? prevSet : (pw ? pw[j] : ""));
    }
  }else{ st.reps[j] = ""; st.w[j] = ""; }
  save(K.active, active);
  render();
  if(now){
    const t = totals();
    if(t.done === t.total){ endRest(false); return; }
    const nextIdx = currentIndex();
    const label = nextIdx === i
      ? "הבא: סט " + (st.done.filter(Boolean).length + 1) + " מתוך " + st.sets + " · " + st.name
      : "הבא: " + active.exercises[nextIdx].name;
    startRest(exRest(active.planId, i, ex) + (active.factor ? active.factor.restAdd : 0), label);
  }
}
function cycleRest(i){
  const plan = planById(active.planId);
  const opts = [45,60,75,90,120,150];
  const cur = exRest(active.planId, i, plan.exercises[i]);
  const next = opts[(opts.indexOf(cur) + 1) % opts.length] || 60;
  restOver[exKey(active.planId,i)] = next;
  save(K.rest, restOver); render();
  toast("מנוחה: " + mmss(next));
}
function finishWorkout(){
  const plan = planById(active.planId);
  const t = totals();
  history.unshift({
    planId: active.planId, planTitle: plan.day + " · " + plan.title,
    date: active.startedAt, endedAt: Date.now(),
    ready: active.ready || null,
    setsDone: t.done, setsTotal: t.total,
    exercises: plan.exercises.map((ex,i) => {
      const st = active.exercises[i];
      return {name: st.name, group: ex.group, done: st.done.filter(Boolean).length, sets: st.sets,
        reps: st.reps.filter((r,j) => st.done[j]), w: st.w.filter((r,j) => st.done[j]), unit: unitOf(ex.reps)};
    })
  });
  history = history.slice(0, 60);
  save(K.hist, history);
  active = null; localStorage.removeItem(K.active);
  endRest(false); keepAwake(false);
  view = "home"; render(); window.scrollTo(0,0);
  toast("האימון נשמר 💪");
  syncNow(true);
}
function cancelWorkout(){
  active = null; localStorage.removeItem(K.active);
  endRest(false); keepAwake(false);
  view = "home"; render(); window.scrollTo(0,0);
}
function applySwap(planId, i, name){
  const ex = planById(planId).exercises[i];
  if(name === ex.name) delete swaps[exKey(planId,i)]; else swaps[exKey(planId,i)] = name;

/* הצעה חודשית: מעדיפה תרגילים תקועים על פני סבב עיוור */
function pickSuggestions(){
  const stalled = [], others = [];
  ["a","c","e"].forEach(pid => {
    const plan = planById(pid);
    plan.exercises.forEach((ex,i) => {
      const cur = exName(pid,i,ex);
      const pool = [ex.name, ...ex.alts].filter(x => x !== cur);
      if(!pool.length) return;
      const row = {planId:pid, i, day:plan.day, group:ex.group, from:cur,
                   to: pool[(history.length + i) % pool.length]};
      const a = advice(ex, cur);
      (a.type === "stall" ? stalled : others).push(row);
    });
  });
  const seen = new Set(); const out = [];
  [...stalled, ...others].forEach(r => {
    if(out.length >= 3 || seen.has(r.planId)) return;
    seen.add(r.planId); out.push(r);
  });
  return out;
}

}

const KS = {cfg:"gt.sbcfg", synced:"gt.synced", del:"gt.deleted"};
let sbCfg   = load(KS.cfg, null);
let lastSync= load(KS.synced, null);
let deleted = load(KS.del, {hist:[], body:[]});
let sb = null, sbUser = null, syncing = false, syncErr = "";
let syncUI = {email:"", sent:false};

const SB_SQL = `create table if not exists gym_state (
  user_id uuid primary key references auth.users(id) on delete cascade,
  data jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now()
);
alter table gym_state enable row level security;
create policy "own_select" on gym_state for select using (auth.uid() = user_id);
create policy "own_insert" on gym_state for insert with check (auth.uid() = user_id);
create policy "own_update" on gym_state for update using (auth.uid() = user_id);`;

function syncOn(){ return !!(sbCfg && sbCfg.url && sbCfg.key); }
async function sbClient(){
  if(!syncOn()) return null;
  if(sb) return sb;
  try{
    const mod = await import("https://esm.sh/@supabase/supabase-js@2");
    sb = mod.createClient(sbCfg.url, sbCfg.key, {auth:{persistSession:true, autoRefreshToken:true, storageKey:"gt.sbauth"}});
    return sb;
  }catch(e){ syncErr = "לא הצלחתי לטעון את ספריית Supabase (אין אינטרנט?)"; return null; }
}
async function sbSession(){
  const c = await sbClient(); if(!c) return null;
  try{
    const {data} = await c.auth.getSession();
    sbUser = data && data.session ? data.session.user : null;
  }catch(e){ sbUser = null; }
  return sbUser;
}

function mergeRemote(r){
  if(!r) return;
  const dh = new Set([...(deleted.hist||[]), ...((r.deleted && r.deleted.hist) || [])]);
  const db = new Set([...(deleted.body||[]), ...((r.deleted && r.deleted.body) || [])]);
  deleted = {hist:[...dh], body:[...db]};
  const hm = new Map();
  [...(r.history || []), ...history].forEach(x => { if(x && !dh.has(x.date)) hm.set(x.date, x); });
  history = [...hm.values()].sort((a,b) => b.date - a.date).slice(0,60);
  const bm = new Map();
  [...(r.body || []), ...body].forEach(x => { if(x && !db.has(x.t)) bm.set(x.t, x); });
  body = [...bm.values()].sort((a,b) => b.t - a.t).slice(0,200);
  swaps = Object.assign({}, r.swaps || {}, swaps);
  restOver = Object.assign({}, r.restOver || {}, restOver);
  if(r.sugg && (!sugg || r.sugg.nextAt > sugg.nextAt)) sugg = r.sugg;
  save(K.hist, history); save(K.body, body); save(K.swaps, swaps);
  save(K.rest, restOver); save(K.sugg, sugg); save(KS.del, deleted);
}
async function syncNow(silent){
  if(!syncOn() || syncing) return;
  const c = await sbClient(); if(!c){ if(!silent) toast(syncErr || "אין חיבור"); return; }
  const u = await sbSession();
  if(!u){ if(!silent) toast("צריך להתחבר קודם"); return; }
  syncing = true; syncErr = ""; if(!silent) render();
  try{
    const res = await c.from("gym_state").select("data").eq("user_id", u.id).maybeSingle();
    if(res.error) throw res.error;
    mergeRemote(res.data ? res.data.data : null);
    const payload = {v:1, history, body, swaps, restOver, sugg, deleted};
    const up = await c.from("gym_state").upsert({user_id:u.id, data:payload, updated_at:new Date().toISOString()});
    if(up.error) throw up.error;
    lastSync = Date.now(); save(KS.synced, lastSync);
    if(!silent) toast("סונכרן");
  }catch(e){
    syncErr = (e && e.message) ? e.message : "שגיאת סנכרון";
    if(!silent) toast("לא הצלחתי לסנכרן: " + syncErr);
  }
  syncing = false; render();
}
function syncStatus(){
  if(!syncOn()) return {dot:"off", text:"לא מחובר — הנתונים על המכשיר בלבד"};
  if(!sbUser) return {dot:"off", text:"מוגדר, אבל צריך להתחבר עם המייל"};
  if(syncErr) return {dot:"err", text:"שגיאה בסנכרון האחרון"};
  return {dot:"on", text: lastSync ? "סונכרן " + relDay(lastSync) + " ב-" +
    new Date(lastSync).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}) : "מחובר, טרם סונכרן"};
}

/* ============ גרפים ============ */
function chartSVG(pts, color){
  const W = 320, H = 96, P = 10;
  if(!pts.length) return "";
  if(pts.length === 1)
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><circle cx="' + (W/2) + '" cy="' + (H/2) + '" r="5" fill="' + color + '"></circle></svg>';
  const ys = pts.map(p => p.y), xs = pts.map(p => p.x);
  const minY = Math.min(...ys), maxY = Math.max(...ys), spanY = (maxY - minY) || 1;
  const minX = Math.min(...xs), maxX = Math.max(...xs), spanX = (maxX - minX) || 1;
  const X = v => P + (v - minX) / spanX * (W - 2*P);
  const Y = v => H - P - (v - minY) / spanY * (H - 2*P);
  const pl = pts.map(p => X(p.x).toFixed(1) + "," + Y(p.y).toFixed(1));
  const area = "M" + X(pts[0].x).toFixed(1) + "," + (H-P) + " L" + pl.join(" L") + " L" + X(pts[pts.length-1].x).toFixed(1) + "," + (H-P) + " Z";
  const last = pts[pts.length-1];
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">' +
    '<path d="' + area + '" fill="' + color + '" opacity=".10"></path>' +
    '<polyline points="' + pl.join(" ") + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>' +
    pts.map(p => '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="2.5" fill="' + color + '" opacity=".55"></circle>').join("") +
    '<circle cx="' + X(last.x).toFixed(1) + '" cy="' + Y(last.y).toFixed(1) + '" r="5" fill="' + color + '"></circle></svg>';
}
function deltaTag(from, to, invert){
  const d = +(to - from).toFixed(1);
  if(!isFinite(d) || d === 0) return '<span class="delta flat">ללא שינוי</span>';
  const good = invert ? d < 0 : d > 0;
  return '<span class="delta ' + (good ? "up" : "down") + '">' + (d > 0 ? "+" : "") + d + '</span>';
}
function weightSeries(){
  const map = new Map();
  [...history].reverse().forEach(s => {
    s.exercises.forEach(e => {
      const t = topW(e);
      if(t == null) return;
      if(!map.has(e.name)) map.set(e.name, []);
      map.get(e.name).push({x: s.date, y: t});
    });
  });
  return [...map.entries()].sort((a,b) => b[1].length - a[1].length);
}

         '<p>בחרתי קודם כל תרגילים שתקועים. אפשר להחליף עכשיו, ותמיד לחזור אחורה.</p><div style="margin-top:10px">';
    pickSuggestions().forEach(s => {
      h += '<div class="alt"><div class="alt-txt"><b>' + esc(s.to) + '</b><span>' + esc(s.day) + ' · ' + esc(s.group) +
           ' · במקום ' + esc(s.from) + '</span></div><button data-act="swap" data-plan="' + s.planId + '" data-i="' + s.i +
           '" data-name="' + esc(s.to) + '">החלף</button></div>';
    });
    h += '</div><div class="btn-row" style="margin-top:14px"><button class="btn ghost" data-act="sugg-done">סיימתי, נתראה בחודש הבא</button></div>' +
         '<button class="btn quiet" data-act="sugg-later">אולי בשבוע הבא</button></div>';
  }

  const swapKeys = Object.keys(swaps);
  if(swapKeys.length){
    h += '<div class="section-label">תרגילים שהחלפת</div><div class="card"><div class="hist-lines" style="border:0;margin:0;padding:0">';
    swapKeys.forEach(k => {
      const [pid, i] = k.split(":");
      const plan = planById(pid); if(!plan || !plan.exercises[+i]) return;
      h += '<div class="hist-line"><b>' + esc(swaps[k]) + '</b><em style="font-size:12.5px">' + esc(plan.day) + '</em>' +
           '<button class="btn quiet" style="width:auto;padding:0 0 0 8px" data-act="unswap" data-plan="' + pid + '" data-i="' + i + '">שחזר</button></div>';
    });
    h += "</div></div>";
  }

  h += '<div class="section-label">שני האימונים האחרונים</div>';
  if(!history.length){
    h += '<div class="card"><div class="empty">עוד לא נרשם אימון. בחר יום למעלה והתחל — ההיסטוריה תופיע כאן.</div></div>';
  }else{
    h += '<div class="stack">';
    history.slice(0,2).forEach(s => {
      const mins = Math.max(1, Math.round((s.endedAt - s.date)/60000));
      h += '<div class="card"><div class="hist-top"><div class="hist-date">' + esc(s.planTitle) + '</div>' +
           '<div class="hist-when">' + esc(relDay(s.date)) + '</div></div>' +
           '<div class="day-meta">' + esc(fmtDate(s.date)) + (s.ready ? ' · ' + esc(s.ready.title) : '') + '</div>' +
           '<div class="hist-stats">' +
           '<div class="stat"><b class="num">' + s.setsDone + "/" + s.setsTotal + '</b><span>סטים</span></div>' +
           '<div class="stat"><b class="num">' + mins + '</b><span>דקות</span></div>' +
           '<div class="stat"><b class="num">' + s.exercises.filter(e => e.done === e.sets).length + "/" + s.exercises.length + '</b><span>תרגילים</span></div>' +
           '</div><div class="hist-lines">';
      s.exercises.forEach(e => {
        const ws = (e.w || []).filter(x => x !== "" && x != null);
        const rs = (e.reps || []).filter(x => x !== "" && x != null);
        const w = ws.length ? ws.join("/") + " ק״ג" : (e.weight ? e.weight + " ק״ג" : "");
        const reps = rs.length ? rs.join("·") + " " + (e.unit || "חזרות") : e.done + "/" + e.sets + " סטים";
        const w2 = w ? w + " × " : "";
        h += '<div class="hist-line"><b>' + esc(e.name) + '</b><em>' + esc(w2 + reps) + '</em></div>';
      });
      h += "</div></div>";
    });
    h += "</div>";
    h += '<button class="btn quiet" data-act="export">ייצוא נתונים (העתקה)</button>';
    if(history.length > 2) h += '<button class="btn quiet" data-act="clear">מחק את כל ההיסטוריה (' + history.length + ' אימונים)</button>';
  }
  return h;
}

  h += '<div class="card" style="margin-top:16px"><h3>מה מצב הגוף היום?</h3>' +
       '<div class="day-meta" style="margin-top:4px">שלוש שאלות, ואתאים את העצימות בהתאם.</div>';

    q.opts.forEach((o,k) => {
      h += '<button class="opt' + (ans[q.id] === k ? " on" : "") + '" data-act="ans" data-q="' + q.id + '" data-v="' + k + '">' + esc(o) + '</button>';

function viewWorkout(){
  const plan = planById(active.planId);
  const t = totals();
  const cur = currentIndex();
  const pct = Math.round(t.done / t.total * 100);
  const elapsed = Math.max(0, Math.round((Date.now() - active.startedAt)/60000));
  let h = header(plan.title, plan.day + " · " + elapsed + " דק׳ באימון" + (active.ready ? " · " + active.ready.title : ""));
  h = h.replace("</header>",
    '<div class="rail"><div class="rail-head"><b class="num">' + pct + '%</b>' +
    '<span>נותרו <b class="num">' + (t.total - t.done) + '</b> סטים ו־<b class="num">' + (t.exTotal - t.exDone) + '</b> תרגילים</span></div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div></div></header>');

  h += '<div class="plan-note">' + esc(plan.note) + '</div><div class="stack">';
  plan.exercises.forEach((ex,i) => {
    const st = active.exercises[i];
    const d = st.done.filter(Boolean).length;
    const isDone = d === st.sets;
    const nextSet = st.done.indexOf(false);
    const nfo = swaps[exKey(active.planId,i)] ? {en: st.name, how:""} : info(ex.name);
    const isOpen = openHow.has(i);
    const unit = unitOf(ex.reps);
    const pw = planWeights(ex, st.name, active.factor);
    const wu = warmups(ex, st.name, active.factor);
    const a = advice(ex, st.name);

    h += '<div class="card ex' + (isDone ? " done" : (i === cur ? " current" : "")) + '">' +
         '<div class="ex-head"><div class="ex-idx">' + (isDone ? "✓" : (i+1)) + '</div><div style="flex:1">' +
         '<div class="ex-group">' + esc(ex.group) + '</div>' +
         '<div class="ex-name">' + esc(st.name) + '</div>' +
         '<div class="ex-sub">' + st.sets + ' סטים · ' + esc(ex.reps) +
         (st.sets < ex.sets ? ' <span style="color:var(--warn)">(סט הופחת)</span>' : '') + '</div>' +
         '<div class="ex-en"><span class="en">' + esc(nfo.en) + '</span>' +
         '<a href="' + esc(ytUrl(nfo.en)) + '" target="_blank" rel="noopener">וידאו ↗</a>' +
         (nfo.how ? '<button class="howbtn" data-act="how" data-i="' + i + '">' + (isOpen ? "הסתר ביצוע" : "איך מבצעים?") + '</button>' : '') +
         '</div></div></div>';
    if(isOpen && nfo.how) h += '<div class="how">' + esc(nfo.how) + '</div>';

    if(!isDone) h += '<div class="tip ' + a.type + '"><span class="ic">' + (a.type === "up" ? "↑" : a.type === "stall" ? "!" : "•") + '</span><span>' + a.text + '</span></div>';
    if(!isDone && wu) h += '<div class="warmline">חימום לפני הסטים: <b>' + wu[0].w + ' ק״ג × ' + wu[0].r + '</b> ואז <b>' + wu[1].w + ' ק״ג × ' + wu[1].r + '</b></div>';

    h += '<div class="ex-body"><div class="sets">';
    for(let j=0;j<st.sets;j++){
      const on = st.done[j];
      const face = on ? (st.reps[j] !== "" ? st.reps[j] : "✓") : (j+1);
      h += '<button class="set' + (on ? " on" : (j === nextSet && i === cur ? " next" : "")) + '" data-act="set" data-i="' + i +
           '" data-j="' + j + '" aria-label="סט ' + (j+1) + '" aria-pressed="' + on + '">' + face + '</button>';
    }
    h += "</div>";
    if(ex.rest > 0){
      const r = exRest(active.planId,i,ex) + (active.factor ? active.factor.restAdd : 0);
      h += '<div style="margin-inline-start:auto"><button class="pill" data-act="rest" data-i="' + i + '">מנוחה <b class="num">' + mmss(r) + '</b></button></div>';
    }
    h += "</div>";

    if(ex.rest > 0){
      h += '<div class="setlog">';
      for(let j=0;j<st.sets;j++){
        const ph = pw ? pw[j] : "";
        h += '<div class="slog"><span class="n">סט ' + (j+1) + '</span>' +
             '<input class="num" inputmode="decimal" data-act="w" data-i="' + i + '" data-j="' + j + '" value="' + esc(st.w[j]) +
             '" placeholder="' + esc(ph) + '"' + (st.done[j] ? "" : " disabled") + '><span class="u">ק״ג</span>' +
             '<span class="u">×</span>' +
             '<input class="num" inputmode="numeric" data-act="rep" data-i="' + i + '" data-j="' + j + '" value="' + esc(st.reps[j]) +
             '" placeholder="' + (targetReps(ex.reps) || "") + '"' + (st.done[j] ? "" : " disabled") + '><span class="u">' + esc(unit) + '</span></div>';
      }
      h += "</div>";
    }
    h += "</div>";
  });
  h += "</div>";

  h += '<div class="btn-row" style="margin-top:18px"><button class="btn danger" data-act="cancel">בטל אימון</button></div>' +
       '<div class="footbar"><div class="footbar-in"><button class="btn" data-act="finish">' +
       (t.done === t.total ? "סיים ושמור אימון 🎉" : "סיים ושמור (" + t.done + "/" + t.total + " סטים)") + '</button></div></div>';
  return h;
}

         '<div class="ch-name">' + wPts[wPts.length-1].y + ' ק״ג</div><div class="ch-now" style="font-size:14px; font-weight:400; color:var(--muted)">' +
         deltaTag(wPts[0].y, wPts[wPts.length-1].y, true) + ' ק״ג מההתחלה</div></div>' + chartSVG(wPts, "var(--accent)") +
         '<div class="ch-axis"><span>' + esc(fmtShort(wPts[0].x)) + '</span><span>' + esc(fmtShort(wPts[wPts.length-1].x)) + '</span></div></div>';
  }
  if(fPts.length){
    h += '<div class="section-label">אחוז שומן</div><div class="card"><div class="ch-top">' +
         '<div class="ch-name">' + fPts[fPts.length-1].y + '%</div><div class="ch-now" style="font-size:14px; font-weight:400; color:var(--muted)">' +
         deltaTag(fPts[0].y, fPts[fPts.length-1].y, true) + '% מההתחלה</div></div>' + chartSVG(fPts, "var(--good)") +
         '<div class="ch-axis"><span>' + esc(fmtShort(fPts[0].x)) + '</span><span>' + esc(fmtShort(fPts[fPts.length-1].x)) + '</span></div></div>';
  }
  h += '<div class="section-label">מדידות אחרונות</div><div class="card">';
  if(!body.length) h += '<div class="empty">עוד לא נרשמה מדידה. שקילה אחת בשבוע מספיקה בהחלט.</div>';
  else body.slice(0,10).forEach((b,i) => {
    const prev = body[i+1];
    let diff = "";
    if(prev && b.w != null && prev.w != null){
      const d = +(b.w - prev.w).toFixed(1);
      if(d !== 0) diff = ' <span style="color:var(--muted); font-weight:400">(' + (d>0?"+":"") + d + ')</span>';
    }
    h += '<div class="log-row"' + (i === 0 ? ' style="border-top:0"' : '') + '>' +
         '<div><div>' + esc(fmtShort(b.t)) + '</div><div class="d">' + esc(relDay(b.t)) + '</div></div>' +
         '<div class="v">' + (b.w != null ? b.w + " ק״ג" + diff : "") + (b.w != null && b.f != null ? " · " : "") +
         (b.f != null ? b.f + "%" : "") + '</div>' +
         '<button class="x" data-act="delbody" data-t="' + b.t + '" aria-label="מחק מדידה">×</button></div>';
  });
  return h + "</div>";
}

/* ============ אירועים ============ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act;
  if(act === "start"){
    const plan = planById(el.dataset.plan);
    if(plan.kind === "cardio"){ startWorkout(plan.id, null); return; }
    pending = {planId: plan.id, answers:{}};
    view = "ready"; render(); window.scrollTo(0,0);
  }
  else if(act === "ans"){ pending.answers[el.dataset.q] = +el.dataset.v; render(); }
  else if(act === "go-workout"){ startWorkout(pending.planId, readinessLevel(pending.answers)); }
  else if(act === "skip-ready"){ startWorkout(pending.planId, null); }
  else if(act === "set"){ toggleSet(+el.dataset.i, +el.dataset.j); }
  else if(act === "rest"){ cycleRest(+el.dataset.i); }
  else if(act === "how"){ const i = +el.dataset.i; openHow.has(i) ? openHow.delete(i) : openHow.add(i); render(); }
  else if(act === "finish"){ finishWorkout(); }
  else if(act === "cancel"){ if(confirm("לבטל את האימון בלי לשמור?")) cancelWorkout(); }
  else if(act === "home"){ view = "home"; pending = null; render(); window.scrollTo(0,0); }
  else if(act === "resume"){ view = "workout"; render(); window.scrollTo(0,0); }
  else if(act === "go-progress"){ view = "progress"; render(); window.scrollTo(0,0); }
  else if(act === "go-body"){ view = "body"; render(); window.scrollTo(0,0); }
  else if(act === "go-sync"){ view = "sync"; render(); window.scrollTo(0,0); sbSession().then(() => render()); }
  else if(act === "sbsave"){ sbSaveCfg(); }
  else if(act === "sbforget"){ sbForget(); }
  else if(act === "sendcode" || act === "resend"){ sbSendCode(); }
  else if(act === "verifycode"){ sbVerify(); }
  else if(act === "syncnow"){ syncNow(false); }
  else if(act === "signout"){ sbSignOut(); }
  else if(act === "addbody"){ addBody(); }
  else if(act === "delbody"){ delBody(+el.dataset.t); }
  else if(act === "export"){ exportData(); }
  else if(act === "skiprest"){ endRest(false); }
  else if(act === "addrest"){ rest.end += 15000; rest.total += 15; tickRest(); }
  else if(act === "swap"){ applySwap(el.dataset.plan, +el.dataset.i, el.dataset.name); }
  else if(act === "unswap"){ applySwap(el.dataset.plan, +el.dataset.i, planById(el.dataset.plan).exercises[+el.dataset.i].name); }
  else if(act === "sugg-done"){ snoozeSugg(30); }
  else if(act === "sugg-later"){ snoozeSugg(7); }
  else if(act === "clear"){ if(confirm("למחוק את כל היסטוריית האימונים?")){
    deleted.hist = [...new Set([...(deleted.hist||[]), ...history.map(x => x.date)])];
    history = []; save(K.hist, history); save(KS.del, deleted); render(); syncNow(true); } }
  else if(act === "theme"){
    const cur = document.documentElement.getAttribute("data-theme");
    const isDark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const next = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    save(K.theme, next);
  }
});
document.addEventListener("input", e => {
  const el = e.target.closest("[data-act]"); if(!el || !active) return;
  const i = +el.dataset.i, j = +el.dataset.j;
  if(el.dataset.act === "rep"){
    const v = el.value.replace(/[^\d]/g, "").slice(0,3);
    if(v !== el.value) el.value = v;
    active.exercises[i].reps[j] = v === "" ? "" : +v;
    const chip = document.querySelector('.set[data-i="' + i + '"][data-j="' + j + '"]');
    if(chip && active.exercises[i].done[j]) chip.textContent = v === "" ? "✓" : v;
    save(K.active, active);
  }else if(el.dataset.act === "w"){
    const v = el.value.replace(/[^\d.]/g, "").slice(0,6);
    if(v !== el.value) el.value = v;
    active.exercises[i].w[j] = v;
    save(K.active, active);
  }
});
try{ const th = load(K.theme, null); if(th) document.documentElement.setAttribute("data-theme", th); }catch(e){}

render();
if(active) keepAwake(true);
if(syncOn()) sbSession().then(u => { render(); if(u) syncNow(true); });
setInterval(() => {
  const t = document.activeElement;
  const typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA");
  if(view === "workout" && !rest.id && !typing) render();
}, 60000);
</script>
